<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="Code Review" font-family="system-ui,'Segoe UI',sans-serif">
  <defs><linearGradient id="or" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb057"/><stop offset="1" stop-color="#f5731f"/></linearGradient></defs>
  <rect width="900" height="700" fill="#191a21"/>
  <!-- tabs + inputs -->
  <text x="30" y="34" font-size="13" fill="#b7b5c0">Notificações</text><text x="140" y="34" font-size="13" fill="#b7b5c0">Horas</text><text x="210" y="34" font-size="13" fill="#b7b5c0">Agente</text>
  <rect x="290" y="16" width="110" height="30" rx="9" fill="url(#or)"/><text x="345" y="36" font-size="13" font-weight="600" fill="#2a160a" text-anchor="middle">Code Review</text>
  <rect x="30" y="58" width="250" height="30" rx="9" fill="#2a2b37"/><text x="44" y="78" font-size="12.5" fill="#f5f3ef">ACME-312</text>
  <rect x="290" y="58" width="200" height="30" rx="9" fill="#2a2b37"/><text x="304" y="78" font-size="12.5" fill="#f5f3ef">develop (base)</text>
  <rect x="500" y="58" width="190" height="30" rx="9" fill="#2a2b37"/><text x="514" y="78" font-size="12.5" fill="#b7b5c0">Review Back-end ▾</text>
  <rect x="800" y="58" width="70" height="30" rx="9" fill="url(#or)"/><text x="835" y="78" font-size="12.5" font-weight="600" fill="#2a160a" text-anchor="middle">Revisar</text>

  <!-- report card -->
  <rect x="30" y="104" width="840" height="512" rx="14" fill="#141a19" stroke="#223029"/>
  <text x="52" y="134" font-size="11" letter-spacing="2" fill="#5fd08a">CODE REVIEW</text>
  <text x="52" y="160" font-size="20" font-weight="700" fill="#eef5f1">Back-end · ACME-312</text>
  <!-- chips -->
  <rect x="52" y="176" width="210" height="26" rx="13" fill="#10281b" stroke="#2f6b3e"/><text x="66" y="193" font-size="12" fill="#8fe6b2">+ feature/ACME-312</text>
  <rect x="270" y="176" width="130" height="26" rx="13" fill="#2a1414" stroke="#6b2f2f"/><text x="284" y="193" font-size="12" fill="#f0a7a7">− develop</text>
  <text x="410" y="193" font-size="12" fill="#85939a">= Change Set revisado</text>

  <!-- resumo / contagem -->
  <g>
    <rect x="52" y="218" width="150" height="56" rx="10" fill="#1a2420" stroke="#223029"/><text x="66" y="241" font-size="12" fill="#85939a">Arquivos alterados</text><text x="66" y="263" font-size="18" font-weight="700" fill="#eef5f1">7</text>
    <rect x="214" y="218" width="150" height="56" rx="10" fill="#1a2420" stroke="#223029"/><text x="228" y="241" font-size="12" fill="#85939a">Findings válidos</text><text x="228" y="263" font-size="18" font-weight="700" fill="#eef5f1">3</text>
    <rect x="376" y="218" width="150" height="56" rx="10" fill="#241a1a" stroke="#3a2020"/><text x="390" y="241" font-size="12" fill="#f0a7a7">🔴 Críticos</text><text x="390" y="263" font-size="18" font-weight="700" fill="#f07b7b">1</text>
    <rect x="538" y="218" width="130" height="56" rx="10" fill="#241f14" stroke="#3a3420"/><text x="552" y="241" font-size="12" fill="#e8c98a">🟡 Alertas</text><text x="552" y="263" font-size="18" font-weight="700" fill="#e8b54a">1</text>
    <rect x="680" y="218" width="138" height="56" rx="10" fill="#18241c" stroke="#223a2a"/><text x="694" y="241" font-size="12" fill="#9fe0b7">🟢 Sugestões</text><text x="694" y="263" font-size="18" font-weight="700" fill="#5fd08a">1</text>
  </g>

  <!-- finding card CRÍTICO -->
  <rect x="52" y="290" width="766" height="150" rx="11" fill="#171d1b" stroke="#2a3330"/><rect x="52" y="290" width="3" height="150" fill="#f07b7b"/>
  <rect x="68" y="306" width="88" height="22" rx="6" fill="#2a1414"/><text x="78" y="321" font-size="11" font-weight="600" fill="#f07b7b">🔴 CRÍTICO</text>
  <text x="166" y="322" font-size="12" fill="#85939a" font-family="monospace">CR-001</text>
  <text x="68" y="346" font-size="14" font-weight="600" fill="#eef5f1">SQL montada por concatenação de parâmetro</text>
  <text x="68" y="368" font-size="12" fill="#85939a">Localização: </text><text x="150" y="368" font-size="12" fill="#cdd6e6" font-family="monospace">src/export/ReportService.ts:48</text>
  <text x="68" y="388" font-size="12" fill="#85939a">Evidência: </text><text x="140" y="388" font-size="12" fill="#cdd6e6" font-family="monospace">`...WHERE tipo = ' + filtro + '`</text>
  <text x="68" y="408" font-size="12" fill="#85939a">Impacto: </text><text x="130" y="408" font-size="12" fill="#c7ced6">risco de SQL injection no relatório.</text>
  <text x="68" y="428" font-size="12" fill="#85939a">Justificativa: </text><text x="158" y="428" font-size="12" fill="#c7ced6">entrada do usuário vai direto na query.</text>

  <!-- finding card ALERTA -->
  <rect x="52" y="452" width="766" height="76" rx="11" fill="#171d1b" stroke="#2a3330"/><rect x="52" y="452" width="3" height="76" fill="#e8b54a"/>
  <rect x="68" y="468" width="84" height="22" rx="6" fill="#241f14"/><text x="78" y="483" font-size="11" font-weight="600" fill="#e8b54a">🟡 ALERTA</text>
  <text x="162" y="484" font-size="12" fill="#85939a" font-family="monospace">CR-002</text>
  <text x="68" y="508" font-size="14" font-weight="600" fill="#eef5f1">catch vazio engole exceção</text>
  <text x="430" y="508" font-size="12" fill="#cdd6e6" font-family="monospace">ReportService.ts:60</text>

  <!-- veredito -->
  <rect x="52" y="542" width="766" height="54" rx="11" fill="#241414" stroke="#6b2f2f"/>
  <text x="70" y="567" font-size="15" font-weight="700" fill="#f07b7b">❌ AJUSTES OBRIGATÓRIOS</text>
  <text x="70" y="585" font-size="12" fill="#c7ced6">Obrigatórios: 1 · Opcionais: 2 · Relatório completo salvo em arquivo.</text>

  <!-- ações: aprovar+mergear / reprovar -->
  <rect x="30" y="632" width="196" height="38" rx="10" fill="url(#or)"/><text x="128" y="656" font-size="13" font-weight="600" fill="#2a160a" text-anchor="middle">Aprovar + mergear</text>
  <rect x="238" y="632" width="150" height="38" rx="10" fill="#22232d" stroke="#6b2f2f"/><text x="313" y="656" font-size="13" fill="#f0a7a7" text-anchor="middle">Reprovar task</text>
  <text x="404" y="656" font-size="11.5" fill="#6f7b74">aprovar → Pending Deploy · reprovar → Fail · ambos logam horas</text>
</svg>
