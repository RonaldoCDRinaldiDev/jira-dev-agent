<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Aba Agente (chat)" font-family="system-ui,'Segoe UI',sans-serif">
  <defs><linearGradient id="or" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb057"/><stop offset="1" stop-color="#f5731f"/></linearGradient></defs>
  <rect width="900" height="520" fill="#191a21"/>
  <!-- tabs -->
  <text x="40" y="40" font-size="13" fill="#b7b5c0">Notificações</text><text x="150" y="40" font-size="13" fill="#b7b5c0">Horas</text>
  <rect x="210" y="22" width="86" height="32" rx="9" fill="url(#or)"/><text x="253" y="43" font-size="13" font-weight="600" fill="#2a160a" text-anchor="middle">Agente</text>
  <text x="320" y="40" font-size="13" fill="#b7b5c0">Code Review</text>
  <!-- inputs -->
  <rect x="24" y="66" width="420" height="34" rx="9" fill="#2a2b37"/><text x="38" y="88" font-size="13" fill="#f5f3ef">ACME-5164</text>
  <rect x="456" y="66" width="420" height="34" rx="9" fill="#2a2b37"/><text x="470" y="88" font-size="13" fill="#85838f">~/GitHub/meu-projeto</text>
  <!-- chat -->
  <rect x="470" y="116" width="406" height="46" rx="12" fill="url(#or)"/><text x="490" y="135" font-size="13" fill="#2a160a">Faça o levantamento da ACME-5164 e</text><text x="490" y="152" font-size="13" fill="#2a160a">proponha um plano. Aguarde meu OK.</text>
  <rect x="24" y="176" width="520" height="44" rx="12" fill="#22232d" stroke="#353745"/><text x="40" y="203" font-size="13" fill="#f5f3ef">Vou ler o fluxo de exportação pra entender onde entra o aviso.</text>
  <rect x="24" y="230" width="330" height="30" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="250" font-size="12" fill="#ffb57c">⚙</text><text x="56" y="250" font-size="12" fill="#b7b5c0" font-family="monospace">Read · src/services/ExportService.ts</text>
  <rect x="24" y="268" width="560" height="44" rx="12" fill="#22232d" stroke="#353745"/><text x="40" y="288" font-size="13" fill="#f5f3ef">Plano: detectar lista vazia e mostrar um toast. Posso editar o</text><text x="40" y="305" font-size="13" fill="#f5f3ef">ExportService?</text>
  <!-- permission -->
  <rect x="24" y="324" width="852" height="96" rx="12" fill="#22232d" stroke="#474a5c"/><rect x="24" y="324" width="3" height="96" fill="url(#or)"/>
  <rect x="44" y="342" width="92" height="22" rx="6" fill="#3a2912"/><text x="52" y="357" font-size="11" font-weight="600" fill="#ffd3ae">PERMISSÃO</text>
  <text x="146" y="358" font-size="13" font-weight="600" fill="#f5f3ef">Edit</text>
  <rect x="44" y="372" width="300" height="24" rx="7" fill="#0d0d15"/><text x="54" y="389" font-size="12" fill="#cdd6e6" font-family="monospace">src/services/ExportService.ts</text>
  <rect x="700" y="368" width="80" height="30" rx="9" fill="url(#or)"/><text x="740" y="388" font-size="12" font-weight="600" fill="#2a160a" text-anchor="middle">Permitir</text>
  <rect x="790" y="368" width="78" height="30" rx="9" fill="#22232d" stroke="#474a5c"/><text x="829" y="388" font-size="12" fill="#f5f3ef" text-anchor="middle">Negar</text>
  <!-- input bar -->
  <rect x="24" y="440" width="740" height="52" rx="11" fill="#2a2b37"/><text x="40" y="470" font-size="13" fill="#85838f">Escreva para o agente...</text>
  <rect x="778" y="446" width="98" height="40" rx="10" fill="url(#or)"/><text x="827" y="471" font-size="13" font-weight="600" fill="#2a160a" text-anchor="middle">Enviar</text>
</svg>
