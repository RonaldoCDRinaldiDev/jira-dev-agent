<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Agente (chat)" font-family="system-ui,'Segoe UI',sans-serif">
  <defs><linearGradient id="or" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb057"/><stop offset="1" stop-color="#f5731f"/></linearGradient></defs>
  <rect width="900" height="520" fill="#191a21"/>
  <text x="40" y="34" font-size="13" fill="#b7b5c0">Notificações</text><text x="150" y="34" font-size="13" fill="#b7b5c0">Horas</text>
  <rect x="210" y="16" width="86" height="30" rx="9" fill="url(#or)"/><text x="253" y="36" font-size="13" font-weight="600" fill="#2a160a" text-anchor="middle">Agente</text>
  <text x="320" y="34" font-size="13" fill="#b7b5c0">Code Review</text>
  <rect x="24" y="56" width="420" height="30" rx="9" fill="#2a2b37"/><text x="38" y="76" font-size="12.5" fill="#f5f3ef">ACME-312</text>
  <rect x="456" y="56" width="420" height="30" rx="9" fill="#2a2b37"/><text x="470" y="76" font-size="12.5" fill="#85838f">~/projetos/portal-pedidos</text>

  <rect x="500" y="98" width="376" height="30" rx="12" fill="url(#or)"/><text x="518" y="118" font-size="12.5" fill="#2a160a">Pode aplicar o fix e rodar os testes.</text>
  <rect x="24" y="138" width="470" height="30" rx="12" fill="#22232d" stroke="#353745"/><text x="40" y="158" font-size="12.5" fill="#f5f3ef">Aplicando a correção e rodando a suíte de testes.</text>
  <rect x="24" y="176" width="300" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="195" font-size="12" fill="#ffb57c">⚙</text><text x="56" y="195" font-size="12" fill="#b7b5c0" font-family="monospace">Edit · src/export/ReportService.ts</text>
  <rect x="24" y="212" width="300" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="231" font-size="12" fill="#ffb57c">⚙</text><text x="56" y="231" font-size="12" fill="#b7b5c0" font-family="monospace">Bash · npm test — 42 passando</text>

  <!-- resposta com bloco Feito/Falta/Status destacado -->
  <rect x="24" y="250" width="620" height="190" rx="12" fill="#22232d" stroke="#353745"/>
  <text x="40" y="274" font-size="12.5" fill="#f5f3ef">Corrigi o acesso à lista vazia e os testes passaram.</text>
  <!-- ffs card -->
  <rect x="40" y="288" width="588" height="136" rx="11" fill="#1b1c24" stroke="#474a5c"/>
  <rect x="40" y="288" width="3" height="45" fill="#3ddc91"/>
  <text x="58" y="311" font-size="11" font-weight="600" fill="#9ff3cf">FEITO</text><text x="120" y="311" font-size="12.5" fill="#e8e6ef">fix em ReportService.ts; npm test verde (42).</text>
  <rect x="40" y="333" width="3" height="45" fill="#f0b429"/>
  <text x="58" y="356" font-size="11" font-weight="600" fill="#f3cd9b">FALTA</text><text x="120" y="356" font-size="12.5" fill="#e8e6ef">seu OK pra commitar e abrir a PR.</text>
  <rect x="40" y="378" width="3" height="45" fill="#fb8c3c"/>
  <text x="58" y="401" font-size="11" font-weight="600" fill="#ffb57c">STATUS</text><text x="120" y="401" font-size="12.5" fill="#e8e6ef">pronto pra commit — aguardando você.</text>

  <rect x="24" y="452" width="740" height="44" rx="11" fill="#2a2b37"/><text x="40" y="479" font-size="13" fill="#85838f">Escreva para o agente...</text>
  <rect x="778" y="452" width="98" height="44" rx="10" fill="url(#or)"/><text x="827" y="479" font-size="13" font-weight="600" fill="#2a160a" text-anchor="middle">Enviar</text>
</svg>
