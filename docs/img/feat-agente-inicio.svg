<svg xmlns="http://www.w3.org/2000/svg" width="900" height="648" viewBox="0 0 900 648" role="img" aria-label="Agente: inicio da task (levantamento)" font-family="system-ui,'Segoe UI',sans-serif">
  <defs><linearGradient id="or" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb057"/><stop offset="1" stop-color="#f5731f"/></linearGradient></defs>
  <rect width="900" height="648" fill="#191a21"/>
  <text x="40" y="34" font-size="13" fill="#b7b5c0">Notificações</text><text x="150" y="34" font-size="13" fill="#b7b5c0">Horas</text>
  <rect x="210" y="16" width="86" height="30" rx="9" fill="url(#or)"/><text x="253" y="36" font-size="13" font-weight="600" fill="#2a160a" text-anchor="middle">Agente</text>
  <text x="320" y="34" font-size="13" fill="#b7b5c0">Code Review</text>
  <rect x="24" y="56" width="420" height="30" rx="9" fill="#2a2b37"/><text x="38" y="76" font-size="12.5" fill="#f5f3ef">ACME-312</text>
  <rect x="456" y="56" width="420" height="30" rx="9" fill="#2a2b37"/><text x="470" y="76" font-size="12.5" fill="#85838f">~/projetos/portal-pedidos</text>

  <!-- usuário pede o levantamento -->
  <rect x="458" y="98" width="418" height="30" rx="12" fill="url(#or)"/><text x="476" y="118" font-size="12.5" fill="#2a160a">Faça o levantamento da ACME-312 e proponha um plano.</text>

  <!-- agente investiga -->
  <rect x="24" y="138" width="430" height="30" rx="12" fill="#22232d" stroke="#353745"/><text x="40" y="158" font-size="12.5" fill="#f5f3ef">Entendi. Vou ler o código envolvido antes de propor algo.</text>

  <!-- ferramentas de leitura (read-only) -->
  <rect x="24" y="176" width="320" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="195" font-size="12" fill="#ffb57c">⚙</text><text x="56" y="195" font-size="12" fill="#b7b5c0" font-family="monospace">Read · src/export/ReportService.ts</text>
  <rect x="24" y="212" width="360" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="231" font-size="12" fill="#ffb57c">⚙</text><text x="56" y="231" font-size="12" fill="#b7b5c0" font-family="monospace">Grep · "export(" — 12 ocorrências em 4 arquivos</text>
  <rect x="24" y="248" width="320" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="267" font-size="12" fill="#ffb57c">⚙</text><text x="56" y="267" font-size="12" fill="#b7b5c0" font-family="monospace">Read · tests/export.test.ts</text>

  <!-- resposta: levantamento detalhado + plano + Feito/Falta/Status -->
  <rect x="24" y="288" width="760" height="328" rx="12" fill="#22232d" stroke="#353745"/>
  <text x="40" y="313" font-size="13.5" font-weight="700" fill="#f5f3ef">Levantamento — ACME-312</text>
  <text x="40" y="337" font-size="12.5" fill="#d7d3ec">Causa provável: a exportação quebra quando a lista de pedidos vem vazia —</text>
  <text x="40" y="355" font-size="12.5" fill="#d7d3ec">o código acessa pedidos[0] sem checar o tamanho, e estoura HTTP 500.</text>
  <text x="40" y="381" font-size="12.5" font-weight="600" fill="#9ff3cf">Plano proposto</text>
  <text x="40" y="402" font-size="12.5" fill="#d7d3ec">1. Tratar lista vazia em ReportService.ts (early-return com relatório vazio).</text>
  <text x="40" y="421" font-size="12.5" fill="#d7d3ec">2. Cobrir o caso com um teste em export.test.ts.</text>
  <text x="40" y="440" font-size="12.5" fill="#d7d3ec">3. Rodar a suíte e confirmar que passa.</text>

  <rect x="40" y="456" width="728" height="142" rx="11" fill="#1b1c24" stroke="#474a5c"/>
  <rect x="40" y="456" width="3" height="47" fill="#3ddc91"/>
  <text x="58" y="480" font-size="11" font-weight="600" fill="#9ff3cf">FEITO</text><text x="120" y="480" font-size="12.5" fill="#e8e6ef">levantamento da ACME-312; causa isolada em ReportService.ts.</text>
  <rect x="40" y="503" width="3" height="47" fill="#f0b429"/>
  <text x="58" y="527" font-size="11" font-weight="600" fill="#f3cd9b">FALTA</text><text x="120" y="527" font-size="12.5" fill="#e8e6ef">seu OK para eu aplicar o plano (3 passos acima).</text>
  <rect x="40" y="550" width="3" height="47" fill="#fb8c3c"/>
  <text x="58" y="574" font-size="11" font-weight="600" fill="#ffb57c">STATUS</text><text x="120" y="574" font-size="12.5" fill="#e8e6ef">plano pronto — aguardando sua aprovação para começar a codar.</text>

  <rect x="24" y="606" width="740" height="30" rx="11" fill="#2a2b37"/><text x="40" y="626" font-size="13" fill="#85838f">Escreva para o agente...</text>
  <rect x="778" y="606" width="98" height="30" rx="10" fill="url(#or)"/><text x="827" y="626" font-size="13" font-weight="600" fill="#2a160a" text-anchor="middle">Enviar</text>
</svg>
