<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Tela de conexão (login do Jira)" font-family="system-ui,'Segoe UI',sans-serif">
  <defs><linearGradient id="or" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb057"/><stop offset="1" stop-color="#f5731f"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#fb8c3c" stop-opacity="0.10"/><stop offset="1" stop-color="#191a21" stop-opacity="0"/></radialGradient></defs>
  <rect width="900" height="500" fill="#191a21"/>
  <rect width="900" height="500" fill="url(#glow)"/>

  <!-- card central -->
  <rect x="220" y="48" width="460" height="404" rx="16" fill="#20212b" stroke="#2f3140"/>

  <text x="248" y="96" font-size="22" font-weight="700" fill="#f5f3ef" font-family="'Space Grotesk',system-ui,sans-serif">Conectar ao Jira</text>
  <text x="248" y="124" font-size="12.5" fill="#9a98a6">Seus dados ficam só na sua máquina. O token é gerado em</text>
  <text x="248" y="142" font-size="12.5" fill="#9a98a6">Atlassian → Account settings → Security → API tokens.</text>

  <!-- URL do Jira -->
  <text x="248" y="178" font-size="12" fill="#b7b5c0">URL do Jira</text>
  <rect x="248" y="186" width="404" height="38" rx="10" fill="#2a2b37" stroke="#353745"/>
  <text x="264" y="210" font-size="13" fill="#6f6d78">https://suaempresa.atlassian.net</text>

  <!-- E-mail -->
  <text x="248" y="248" font-size="12" fill="#b7b5c0">Seu e-mail</text>
  <rect x="248" y="256" width="404" height="38" rx="10" fill="#2a2b37" stroke="#353745"/>
  <text x="264" y="280" font-size="13" fill="#6f6d78">voce@empresa.com</text>

  <!-- API token -->
  <text x="248" y="318" font-size="12" fill="#b7b5c0">API token</text>
  <rect x="248" y="326" width="404" height="38" rx="10" fill="#2a2b37" stroke="#fb8c3c"/>
  <text x="264" y="350" font-size="14" fill="#cdd0da" letter-spacing="2">••••••••••••••••••••</text>

  <!-- botão -->
  <rect x="248" y="388" width="404" height="42" rx="11" fill="url(#or)"/>
  <text x="450" y="414" font-size="14" font-weight="600" fill="#2a160a" text-anchor="middle">Conectar</text>

  <text x="450" y="474" font-size="11.5" fill="#6f6d78" text-anchor="middle">Tudo local • nada é enviado a terceiros além do seu próprio Jira</text>
</svg>
