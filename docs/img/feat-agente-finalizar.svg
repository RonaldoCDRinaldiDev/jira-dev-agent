<svg xmlns="http://www.w3.org/2000/svg" width="900" height="636" viewBox="0 0 900 636" role="img" aria-label="Agente finalizando a task" font-family="system-ui,'Segoe UI',sans-serif">
  <defs><linearGradient id="or" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb057"/><stop offset="1" stop-color="#f5731f"/></linearGradient></defs>
  <rect width="900" height="636" fill="#191a21"/>
  <text x="40" y="34" font-size="13" fill="#b7b5c0">Notificações</text><text x="150" y="34" font-size="13" fill="#b7b5c0">Horas</text>
  <rect x="210" y="16" width="86" height="30" rx="9" fill="url(#or)"/><text x="253" y="36" font-size="13" font-weight="600" fill="#2a160a" text-anchor="middle">Agente</text>
  <text x="320" y="34" font-size="13" fill="#b7b5c0">Code Review</text>
  <rect x="24" y="56" width="420" height="30" rx="9" fill="#2a2b37"/><text x="38" y="76" font-size="12.5" fill="#f5f3ef">ACME-312</text>
  <rect x="456" y="56" width="420" height="30" rx="9" fill="#2a2b37"/><text x="470" y="76" font-size="12.5" fill="#85838f">~/projetos/portal-pedidos</text>

  <!-- usuário manda finalizar -->
  <rect x="470" y="98" width="406" height="30" rx="12" fill="url(#or)"/><text x="488" y="118" font-size="12.5" fill="#2a160a">Pode finalizar: commita, abre o PR e move o Jira.</text>

  <!-- agente responde e executa -->
  <rect x="24" y="138" width="520" height="30" rx="12" fill="#22232d" stroke="#353745"/><text x="40" y="158" font-size="12.5" fill="#f5f3ef">Fechando a ACME-312. Commitando, abrindo o PR e atualizando o Jira.</text>

  <!-- comandos que o agente roda -->
  <rect x="24" y="176" width="250" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="195" font-size="12" fill="#ffb57c">⚙</text><text x="56" y="195" font-size="12" fill="#b7b5c0" font-family="monospace">Bash · git add -A</text>
  <rect x="24" y="212" width="560" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="231" font-size="12" fill="#ffb57c">⚙</text><text x="56" y="231" font-size="12" fill="#b7b5c0" font-family="monospace">Bash · git commit -m "fix(ACME-312): corrige erro 500 na exportação"</text>
  <rect x="24" y="248" width="360" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="267" font-size="12" fill="#ffb57c">⚙</text><text x="56" y="267" font-size="12" fill="#b7b5c0" font-family="monospace">Bash · git push origin feature/ACME-312</text>
  <rect x="24" y="284" width="380" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="303" font-size="12" fill="#ffb57c">⚙</text><text x="56" y="303" font-size="12" fill="#b7b5c0" font-family="monospace">Bash · gh pr create  →  PR #128 aberta</text>
  <rect x="24" y="320" width="380" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="339" font-size="12" fill="#ffb57c">↪</text><text x="56" y="339" font-size="12" fill="#b7b5c0" font-family="monospace">Jira · ACME-312 → "Code Review"</text>
  <rect x="24" y="356" width="380" height="28" rx="9" fill="#2a2b37" stroke="#353745"/><text x="38" y="375" font-size="12" fill="#ffb57c">↪</text><text x="56" y="375" font-size="12" fill="#b7b5c0" font-family="monospace">Jira · worklog +42min lançado</text>

  <!-- resposta final com bloco Feito/Falta/Status -->
  <rect x="24" y="398" width="700" height="196" rx="12" fill="#22232d" stroke="#353745"/>
  <text x="40" y="422" font-size="12.5" fill="#f5f3ef">Task fechada. PR aberta e Jira atualizado.</text>
  <rect x="40" y="436" width="668" height="142" rx="11" fill="#1b1c24" stroke="#474a5c"/>
  <rect x="40" y="436" width="3" height="47" fill="#3ddc91"/>
  <text x="58" y="460" font-size="11" font-weight="600" fill="#9ff3cf">FEITO</text><text x="120" y="460" font-size="12.5" fill="#e8e6ef">commit + push; PR #128 aberta; Jira em "Code Review"; 42min lançados.</text>
  <rect x="40" y="483" width="3" height="47" fill="#f0b429"/>
  <text x="58" y="507" font-size="11" font-weight="600" fill="#f3cd9b">FALTA</text><text x="120" y="507" font-size="12.5" fill="#e8e6ef">o review do time na PR #128.</text>
  <rect x="40" y="530" width="3" height="47" fill="#fb8c3c"/>
  <text x="58" y="554" font-size="11" font-weight="600" fill="#ffb57c">STATUS</text><text x="120" y="554" font-size="12.5" fill="#e8e6ef">task fechada do meu lado — aguardando review.</text>

  <rect x="24" y="606" width="740" height="18" rx="9" fill="#191a21"/>
  <rect x="24" y="598" width="740" height="30" rx="11" fill="#2a2b37"/><text x="40" y="618" font-size="13" fill="#85838f">Escreva para o agente...</text>
  <rect x="778" y="598" width="98" height="30" rx="10" fill="url(#or)"/><text x="827" y="618" font-size="13" font-weight="600" fill="#2a160a" text-anchor="middle">Enviar</text>
</svg>
